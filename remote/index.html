<!doctype html>
<html lang="el" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#090e0e">
<title>Waymark Remote</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="style.css">
<style>
  .web { max-width: 720px; margin: 0 auto; padding: 16px; }
  .web .card + .card { margin-top: 16px; }
  .web .bigcode { font-size: clamp(26px, 8vw, 40px); }
  .web video { width: 100%; border-radius: 10px; margin-top: 12px; background: #000; }
  .web textarea { width: 100%; min-height: 64px; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border-strong); font: 13px/1.4 ui-monospace, Consolas, monospace; color: inherit; }
  .web .steps { margin: 0 0 12px; padding-left: 20px; }
  .web .steps li { margin: 4px 0; }
  .web .files td:nth-child(3) { display: none; }
  @media (min-width: 601px) { .web .files td:nth-child(3) { display: table-cell; } }
  .btn.small { min-height: 34px; padding: 4px 10px; }
  .top .lang { min-width: 44px; }
  .web footer { margin-top: 20px; text-align: center; }
  .web .files td:first-child { width: 100%; }
  .web .files .fname { word-break: normal; overflow-wrap: anywhere; }
  .web .files td { white-space: nowrap; }
  .web .files td:first-child { white-space: normal; }
  .web .files td.act .btn { padding: 4px 8px; }
  #topStatus { white-space: nowrap; }
  @media (max-width: 480px) {
    .top { gap: 6px; padding: 8px 10px; }
    .brand span { display: none; }
    .web { padding: 10px; }
  }
</style>
<script type="module" src="remote.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="currentColor"/><path d="M32 14C24 14 18 20 18 28c0 10 14 24 14 24s14-14 14-24c0-8-6-14-14-14z" fill="none" stroke="var(--bg)" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="28" r="4.5" fill="var(--bg)"/></svg>
    <span>Waymark Remote</span>
  </div>
  <span class="spacer"></span>
  <span id="topStatus"></span>
  <button id="btnLang" class="btn ghost lang" type="button">EN</button>
  <button id="btnTheme" class="btn ghost" type="button" data-i18n-title="theme" aria-label="Theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="web">
  <!-- 1. No QR yet -->
  <section id="sStart" hidden>
    <div class="card">
      <h2>Waymark Remote</h2>
      <p data-i18n="w_scanLead"></p>
      <div class="row"><button id="btnScan" class="btn primary" type="button" data-i18n="w_scan"></button></div>
      <video id="video" playsinline muted hidden></video>
      <label class="field" style="margin-top:14px"><span data-i18n="w_paste"></span>
        <textarea id="pasteBox" spellcheck="false" autocomplete="off"></textarea></label>
      <div class="row end"><button id="btnPaste" class="btn" type="button" data-i18n="w_continue"></button></div>
      <div id="startMsg" class="msg err" hidden></div>
    </div>
  </section>

  <!-- 2. QR read: name and role -->
  <section id="sSetup" hidden>
    <div class="card">
      <h2 data-i18n="w_you"></h2>
      <label class="field"><span data-i18n="nameLabel"></span>
        <input id="nameInput" type="text" maxlength="60" autocomplete="off"></label>
      <div class="small muted" data-i18n="roleLead" style="margin-bottom:6px"></div>
      <div class="roles" role="radiogroup">
        <label><input type="radio" name="role" value="operator" checked><span data-i18n="role_operator"></span></label>
        <label><input type="radio" name="role" value="secretariat"><span data-i18n="role_secretariat"></span></label>
        <label><input type="radio" name="role" value="supervisor"><span data-i18n="role_supervisor"></span></label>
      </div>
      <p class="small muted" data-i18n="w_cameraWhy"></p>
      <div class="row end"><button id="btnSetup" class="btn primary" type="button" data-i18n="w_continue"></button></div>
      <div id="setupMsg" class="msg err" hidden></div>
    </div>
  </section>

  <!-- 3. Return code -->
  <section id="sCode" hidden>
    <div class="card">
      <h2 data-i18n="w_codeTitle"></h2>
      <ol class="steps"><li data-i18n="w_code1"></li><li data-i18n="w_code2"></li></ol>
      <div id="retCode" class="bigcode num">…</div>
      <div id="manualIP" hidden style="margin-top:12px">
        <p class="small" data-i18n="w_ipLead"></p>
        <div class="row"><input id="ipInput" type="text" inputmode="decimal" placeholder="192.168.1.23" style="max-width:200px">
          <button id="btnIP" class="btn" type="button" data-i18n="w_ipBtn"></button></div>
      </div>
      <div class="row end" style="margin-top:12px"><button id="btnConnect" class="btn primary" type="button" data-i18n="connectBtn" disabled></button></div>
      <div id="codeMsg" class="msg" hidden></div>
    </div>
  </section>

  <!-- 4. Check number -->
  <section id="sSas" hidden>
    <div class="card">
      <h2 data-i18n="sasLead"></h2>
      <div id="sasNum" class="sas num"></div>
      <p class="small muted" data-i18n="w_sasHint"></p>
    </div>
  </section>

  <!-- 5. Connected -->
  <section id="sLive" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div>
          <h3 id="pName"></h3>
          <div id="pInfo" class="small muted"></div>
        </div>
        <div class="row">
          <button id="btnTake" class="btn primary" type="button" data-i18n="take"></button>
          <button id="btnRelease" class="btn" type="button" data-i18n="release" hidden></button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabPres" type="button" aria-selected="true" data-i18n="tabPres"></button>
        <button role="tab" id="tabFiles" type="button" aria-selected="false" data-i18n="tabFiles"></button>
      </div>
      <section id="panePres">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <div style="min-width:0"><div id="cFile" style="word-break:break-word"></div><div id="cStatus" class="small"></div></div>
          <div class="slidebig num" id="cSlide">–</div>
        </div>
        <div class="pad">
          <button class="btn big" id="bPrev" type="button" data-i18n="prev"></button>
          <button class="btn big primary" id="bNext" type="button" data-i18n="next"></button>
          <button class="btn" id="bStart" type="button" data-i18n="startShow"></button>
          <button class="btn" id="bBlack" type="button" data-i18n="black"></button>
          <div class="row wide">
            <input id="gotoNum" type="number" min="1" inputmode="numeric" style="max-width:110px" aria-label="Slide">
            <button class="btn" id="bGoto" type="button" data-i18n="goto"></button>
            <span style="flex:1"></span>
            <button class="btn" id="bEnd" type="button" data-i18n="endShow"></button>
            <button class="btn ghost" id="bClose" type="button" data-i18n="closeFile"></button>
          </div>
        </div>
        <div id="cmdMsg" class="msg err" hidden></div>
      </section>
      <section id="paneFiles" hidden>
        <div class="toolbar">
          <label class="btn primary"><span data-i18n="upload"></span><input id="fUpload" type="file" multiple hidden></label>
          <label class="btn" id="fUploadDirBtn"><span data-i18n="uploadDir"></span><input id="fUploadDir" type="file" webkitdirectory multiple hidden></label>
          <button id="fMkdir" class="btn" type="button" data-i18n="mkdir"></button>
          <button id="fRefresh" class="btn ghost" type="button" data-i18n="refresh"></button>
        </div>
        <div id="dropZone" class="drop" data-i18n="dropHere"></div>
        <div class="small muted" id="curDir"></div>
        <table class="files"><tbody id="cFiles"></tbody></table>
        <div id="progress" class="progress"></div>
        <div id="fileMsg" class="msg err" hidden></div>
      </section>
    </div>
    <div class="row end" style="margin-top:12px"><button id="btnBye" class="btn danger" type="button" data-i18n="disconnect"></button></div>
  </section>

  <!-- 6. Closed -->
  <section id="sEnd" hidden>
    <div class="card">
      <h2 id="endTitle" data-i18n="w_ended"></h2>
      <p class="muted" data-i18n="w_endedLead"></p>
      <div class="row"><button id="btnAgain" class="btn primary" type="button" data-i18n="w_scan"></button></div>
    </div>
  </section>

  <footer class="small muted" data-i18n="w_privacy"></footer>
</main>

<dialog id="askDlg">
  <p id="askText"></p>
  <input id="askInput" type="text" maxlength="200">
  <div class="row end" style="margin-top:12px">
    <button id="askNo" class="btn ghost" type="button" data-i18n="cancel"></button>
    <button id="askYes" class="btn primary" type="button" data-i18n="ok"></button>
  </div>
</dialog>
</body>
</html>
