# Waymark relay (Cloudflare Worker). Deploy: npx wrangler deploy, then
# npx wrangler secret put ACCESS_KEY. See README.md.
name = "waymark-relay"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = false
