name: Waymark Remote CI

on:
  push:
    branches: [main]
    paths: ["app/**", "remote/**", ".github/workflows/remote-*.yml"]
  pull_request:
    paths: ["app/**", "remote/**", ".github/workflows/remote-*.yml"]

permissions:
  contents: read

concurrency:
  group: remote-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Check the browser Controller shares the app's strings and styles
        run: scripts/sync-web.sh --check
      - name: Vet and test the shared packages
        run: |
          go vet ./internal/...
          GOOS=windows go vet ./...
          go test -race ./internal/...
      - name: Build the Windows exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags desktop,production \
            -ldflags "-s -w -H windowsgui -X main.Version=0.0.0-ci" -o WaymarkRemote.exe ./cmd/waymark-remote
          ls -la WaymarkRemote.exe
      - name: Browser Controller against a real Agent (headless Chromium)
        run: |
          cd e2e && npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
          cd .. && go test -tags browser -count=1 -v ./e2e

  desktop:
    # The desktop app needs CGO and the system WebView on Linux and macOS,
    # so these build natively. The drivers there are Impress, the built-in
    # PDF viewer and the system viewer.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2t64 desktop-file-utils
      - name: Vet and package
        run: |
          TAGS=desktop,production
          [ "$RUNNER_OS" = Linux ] && TAGS=$TAGS,webkit2_41
          go vet -tags $TAGS ./cmd/waymark-remote
          scripts/package.sh $([ "$RUNNER_OS" = Linux ] && echo linux || echo macos) 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: waymark-remote-${{ runner.os }}
          path: app/dist/*
          retention-days: 14
