name: Download count

# Writes the Waymark app's download count into index.html once a day, so the
# page shows it without the visitor's browser calling the counter.
# See tools/update_downloads.py.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update the count
        run: python3 tools/update_downloads.py index.html
      - name: Commit if it changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update the download count"
          git push
